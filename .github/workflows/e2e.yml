name: E2E (Playwright)

# Runs the browser + API end-to-end suite against a LIVE deployment.
# GitHub runners have open network, so they can reach tresorcouture.in
# (unlike the restricted dev sandbox).
#
# Triggers:
#   - manual (workflow_dispatch) with an optional target URL
#   - daily schedule as a production health check
#
# Set the default target via repo variable E2E_BASE_URL (Settings → Secrets
# and variables → Actions → Variables). Falls back to production.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (e.g. https://tresorcouture.in or a Vercel preview)'
        required: false
        default: ''
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC daily production smoke

permissions:
  contents: read
  actions: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    env:
      # input (manual) → repo variable → production default
      BASE_URL: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url || vars.E2E_BASE_URL || 'https://tresorcouture.in' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E against ${{ env.BASE_URL }}
        run: npm run test:e2e:signed-in:smoke

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
