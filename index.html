<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5ECDC" />

    <title>Tresor Couture · Designer Lehengas, Sarees & Heritage Fabrics — Hyderabad</title>
    <meta
      name="description"
      content="Couture boutique in Hyderabad — bridal lehenga cholis, pre-draped sarees and rare hand-woven fabrics: Banarasi, Patola, Jamdani, Kanjivaram. Visit the studio or shop online, delivered across India."
    />

    <link rel="canonical" href="https://tresorcouture.in/" />

    <!-- Fonts, loaded WITHOUT render-blocking. The old @import at the top of
         the bundled CSS made every full document load wait on
         fonts.googleapis.com before first paint (and before DOMContentLoaded,
         since module scripts wait on blocking stylesheets). The print-media
         swap loads the same stylesheet asynchronously; text renders in the
         fallback face and swaps when the fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <link rel="icon" href="/branding/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/branding/favicons/site.webmanifest" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage previews) -->

    <meta property="og:site_name" content="Tresor Couture" />
    <meta property="og:title" content="Tresor Couture · Designer Lehengas, Sarees & Heritage Fabrics — Hyderabad" />
    <meta
      property="og:description"
      content="Bridal lehenga cholis, pre-draped sarees and hand-woven heritage fabrics from the Hyderabad atelier. Delivered across India."
    />
    <meta property="og:url" content="https://tresorcouture.in/" />
    <meta property="og:image" content="https://tresorcouture.in/branding/social/og-default-1200x630.png" />
    <meta property="og:image:alt" content="Tresor Couture — Heritage Indian Weaves" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->

    />
    <meta name="twitter:image" content="https://tresorcouture.in/branding/social/og-default-1200x630.png" />
