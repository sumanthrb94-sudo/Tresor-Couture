<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5ECDC" />
    <link rel="canonical" href="https://tresor-couture.vercel.app/" />

    <!--
      Analytics & marketing trackers (GA4 / Meta Pixel) are intentionally NOT
      hardcoded here. They are injected at runtime by src/lib/analytics.ts, but
      only after the visitor grants consent and only if the corresponding
      VITE_GA4_MEASUREMENT_ID / VITE_META_PIXEL_ID env vars are configured.
    -->

    <title>Tresor Couture · Heritage Indian Fabrics</title>
    <meta
      name="description"
      content="Tresor Couture rescues India's dying weaves — Banarasi, Patola, Jamdani, Kanjivaram, Pashmina and more. Hand-woven luxury fabrics, sold by the meter and shipped worldwide."
    />

    <link rel="icon" href="/branding/favicons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/branding/favicons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/branding/favicons/site.webmanifest" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tresor Couture" />
    <meta property="og:title" content="Tresor Couture · Heritage Indian Fabrics" />
    <meta
      property="og:description"
      content="Hand-woven luxury fabrics from India — Banarasi, Patola, Jamdani, Kanjivaram and more. Sold by the meter, shipped worldwide."
    />
    <meta property="og:url" content="https://tresor-couture.vercel.app/" />
    <meta property="og:image" content="https://tresor-couture.vercel.app/branding/social/og-default-1200x630.png" />
    <meta property="og:image:alt" content="Tresor Couture — Heritage Indian Weaves" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tresor Couture · Heritage Indian Fabrics" />
    <meta
      name="twitter:description"
      content="Hand-woven luxury fabrics from India. Sold by the meter, shipped worldwide."
    />
    <meta name="twitter:image" content="https://tresor-couture.vercel.app/branding/social/og-default-1200x630.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; text-align: center; color: #2A2520;">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Tresor Couture · Heritage Indian Fabrics</h1>
        <p style="line-height: 1.6;">
          Tresor Couture rescues India's dying weaves — Banarasi, Patola, Jamdani,
          Kanjivaram, Pashmina and more. Hand-woven luxury fabrics, sold by the meter
          and shipped worldwide. This shop needs JavaScript enabled to browse the catalogue.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
