<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Trésor Couture monogram">
  <title>Trésor Couture</title>
  <defs>
    <linearGradient id="tc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B97A"/>
      <stop offset="50%" stop-color="#B8893A"/>
      <stop offset="100%" stop-color="#8E6520"/>
    </linearGradient>
  </defs>

  <!-- T -->
  <g fill="url(#tc-gold)">
    <!-- top serif bar of T (with subtle bracketed serifs) -->
    <path d="M 70 70
             L 70 60 Q 70 56 74 56
             L 196 56 Q 200 56 200 60
             L 200 70
             L 196 70 Q 192 72 188 76
             L 184 80
             L 86 80
             L 82 76 Q 78 72 74 70 Z"/>
    <!-- vertical stem of T -->
    <path d="M 124 80
             L 124 232
             Q 124 240 116 244
             L 116 252
             L 162 252
             L 162 244
             Q 154 240 154 232
             L 154 80 Z"/>
  </g>

  <!-- C — open ring -->
  <g fill="none" stroke="url(#tc-gold)" stroke-width="14" stroke-linecap="round">
    <path d="M 248 100
             C 218 100 198 124 198 156
             C 198 188 220 212 250 212"/>
    <!-- inner accent line on C -->
    <path d="M 252 116
             C 232 116 218 134 218 156
             C 218 178 232 196 252 196"
          stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Floral flourish off the C -->
  <g stroke="url(#tc-gold)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 250 212 Q 268 222 282 240"/>
    <path d="M 264 222 Q 274 230 280 244"/>
    <path d="M 250 212 Q 256 230 252 250"/>
  </g>
  <g fill="url(#tc-gold)">
    <circle cx="280" cy="240" r="3.2"/>
    <circle cx="282" cy="246" r="2.4"/>
    <circle cx="252" cy="250" r="2.6"/>
    <circle cx="246" cy="244" r="2"/>
    <circle cx="274" cy="232" r="2"/>
  </g>

  <!-- Wordmark -->
  <g fill="url(#tc-gold)" font-family="'Cormorant Garamond', 'Times New Roman', serif" text-anchor="middle">
    <text x="160" y="284" font-size="26" letter-spacing="6">TRÉSOR</text>
    <text x="160" y="306" font-size="11" letter-spacing="6">COUTURE</text>
  </g>

  <!-- decorative flourish under wordmark -->
  <g stroke="url(#tc-gold)" stroke-width="1" stroke-linecap="round">
    <line x1="74" y1="298" x2="118" y2="298"/>
    <line x1="202" y1="298" x2="246" y2="298"/>
  </g>
  <g fill="url(#tc-gold)">
    <polygon points="120,298 124,295 124,301"/>
    <polygon points="200,298 196,295 196,301"/>
  </g>
</svg>
