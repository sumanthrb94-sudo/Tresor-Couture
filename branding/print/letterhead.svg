  <line x1="240" y1="430" x2="2240" y2="430" stroke="url(#gold)" stroke-width="1.4"/>
  <line x1="240" y1="442" x2="2240" y2="442" stroke="url(#gold)" stroke-width="0.6" opacity="0.7"/>

