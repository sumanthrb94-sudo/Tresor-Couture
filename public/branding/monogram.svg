<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Trésor Couture monogram">
  <title>Trésor Couture</title>
  <defs>
    <linearGradient id="tc-gold" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#E8CD8B"/>
      <stop offset="40%" stop-color="#C5A059"/>
      <stop offset="80%" stop-color="#9A7028"/>
      <stop offset="100%" stop-color="#7A571B"/>
    </linearGradient>
    <linearGradient id="tc-gold-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1DFA8"/>
      <stop offset="60%" stop-color="#D4AE6A"/>
      <stop offset="100%" stop-color="#B0843A"/>
    </linearGradient>
    <linearGradient id="tc-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2418"/>
      <stop offset="100%" stop-color="#1F140C"/>
    </linearGradient>
    <radialGradient id="tc-skin" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#F5DCC1"/>
      <stop offset="100%" stop-color="#D4A77E"/>
    </radialGradient>
  </defs>

  <!-- ========================== -->
  <!-- T LETTERFORM (serif, gold) -->
  <!-- ========================== -->
  <g fill="url(#tc-gold)">
    <!-- Top horizontal bar with elegant bracketed serifs -->
    <path d="M 130 280
             Q 130 268 142 268
             L 470 268
             Q 482 268 482 280
             L 482 312
             Q 470 318 462 326
             Q 458 330 454 332
             L 168 332
             Q 162 330 158 326
             Q 150 318 138 312 Z"/>
    <!-- Vertical stem -->
    <path d="M 280 332
             L 280 700
             Q 280 718 268 728
             Q 256 736 252 740
             L 252 754
             L 360 754
             L 360 740
             Q 356 736 344 728
             Q 332 718 332 700
             L 332 332 Z"/>
    <!-- Inner highlight on stem (left edge) -->
    <path d="M 286 340 L 286 700 Q 286 712 280 720 L 286 720 L 286 340 Z"
          fill="url(#tc-gold-light)" opacity="0.6"/>
  </g>

  <!-- ========================== -->
  <!-- C LETTERFORM (serif, gold) -->
  <!-- ========================== -->
  <g fill="none" stroke="url(#tc-gold)" stroke-width="44" stroke-linecap="round">
    <path d="M 632 360
             C 562 360 510 432 510 510
             C 510 588 562 660 632 660"/>
  </g>
  <!-- Inner accent line on C -->
  <g fill="none" stroke="url(#tc-gold-light)" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M 638 388
             C 580 388 542 444 542 510
             C 542 576 580 632 638 632"/>
  </g>
  <!-- Top serif of C -->
  <g fill="url(#tc-gold)">
    <path d="M 612 348 Q 632 348 644 358 L 642 376 Q 626 366 612 372 Z"/>
    <path d="M 612 660 Q 632 672 644 660 L 642 644 Q 626 654 612 648 Z"/>
  </g>

  <!-- ========================== -->
  <!-- RECLINING FIGURE (stylized) -->
  <!-- Figure rests on top of T's crossbar from x ~ 180 to ~ 540 -->
  <!-- ========================== -->

  <!-- Long flowing hair (cascading down behind the figure) -->
  <g fill="url(#tc-hair)">
    <path d="M 175 180
             C 145 230 130 290 145 350
             C 155 400 170 440 195 470
             C 178 480 158 478 145 460
             C 130 432 125 388 130 350
             C 132 308 142 256 168 200 Z"/>
    <path d="M 195 470
             C 215 478 225 478 240 472
             C 235 488 220 500 200 502
             C 188 502 180 494 178 482 Z"/>
    <!-- Hair strands flowing -->
    <path d="M 162 230 C 152 280 152 340 168 390"
          stroke="#0F0905" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 178 220 C 170 270 168 330 182 380"
          stroke="#0F0905" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Flower in hair -->
  <g transform="translate(176 178)">
    <circle r="14" fill="#F2E4C4"/>
    <g fill="#E0C994">
      <ellipse cx="0" cy="-9" rx="6" ry="9"/>
      <ellipse cx="9" cy="-3" rx="9" ry="6"/>
      <ellipse cx="6" cy="9" rx="6" ry="9"/>
      <ellipse cx="-6" cy="9" rx="6" ry="9"/>
      <ellipse cx="-9" cy="-3" rx="9" ry="6"/>
    </g>
    <circle r="4" fill="#C5A059"/>
  </g>

  <!-- Head profile (simple, looking up-left) -->
  <path d="M 198 130
           Q 218 110 240 116
           Q 252 122 254 138
           Q 256 152 248 162
           Q 254 168 252 178
           Q 250 188 240 192
           Q 226 196 214 192
           Q 200 186 196 174
           Q 188 162 192 148
           Q 192 138 198 130 Z"
        fill="url(#tc-skin)"/>
  <!-- subtle facial line -->
  <path d="M 246 142 Q 252 148 252 156 Q 252 162 248 166"
        stroke="#A87B52" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Earring -->
  <g fill="url(#tc-gold)">
    <circle cx="226" cy="178" r="3"/>
    <path d="M 224 180 Q 224 188 222 192 L 220 188 Q 220 184 222 180 Z"/>
  </g>

  <!-- Body / saree drape — stylized reclining pose -->
  <g fill="url(#tc-gold-light)" opacity="0.95">
    <!-- Torso + chest area -->
    <path d="M 252 200
             C 268 210 282 222 290 240
             L 296 252
             C 320 252 350 248 380 248
             C 410 248 444 248 470 252
             C 488 254 506 256 524 264
             C 540 270 552 268 562 264
             L 568 264
             C 580 268 590 268 596 264
             L 596 268
             C 588 274 568 276 552 274
             C 530 272 510 270 488 268
             C 460 264 426 262 392 264
             C 350 264 314 268 286 274
             C 280 264 270 252 256 244
             C 248 232 244 218 250 204 Z"/>
  </g>

  <!-- Saree pleats running down between T stem and C -->
  <g fill="url(#tc-gold-light)" opacity="0.85">
    <path d="M 332 268
             L 336 700
             Q 338 720 346 736
             L 360 754
             L 380 754
             L 392 736
             Q 400 718 402 700
             L 408 274
             C 396 270 372 268 350 268 Z"/>
    <!-- intricate gold embroidery hint -->
    <path d="M 340 320 L 340 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 350 320 L 350 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 360 320 L 360 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 370 320 L 370 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 380 320 L 380 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 390 320 L 390 680" stroke="url(#tc-gold)" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- Decorative border at hem with paisley dots -->
    <path d="M 332 700 L 408 700" stroke="url(#tc-gold)" stroke-width="3" fill="none"/>
    <g fill="url(#tc-gold)">
      <circle cx="344" cy="715" r="3"/>
      <circle cx="358" cy="720" r="3"/>
      <circle cx="372" cy="715" r="3"/>
      <circle cx="386" cy="720" r="3"/>
      <circle cx="400" cy="715" r="3"/>
    </g>
  </g>

  <!-- Right leg / draped over body, extending toward C -->
  <g fill="url(#tc-gold-light)" opacity="0.9">
    <path d="M 396 252
             C 440 248 478 248 506 252
             C 524 256 540 264 552 268
             C 538 274 526 274 510 270
             C 488 266 462 264 432 264
             C 416 264 402 264 392 266 Z"/>
  </g>

  <!-- Bare foot at right end (peeking out near T's right serif) -->
  <g fill="url(#tc-skin)">
    <path d="M 552 244
             Q 564 244 574 248
             Q 580 252 580 258
             Q 580 264 574 266
             L 572 270
             Q 558 270 548 266
             Q 542 262 542 256
             Q 542 250 548 246 Z"/>
    <!-- toes -->
    <circle cx="568" cy="252" r="2"/>
    <circle cx="572" cy="258" r="2"/>
    <circle cx="572" cy="264" r="2"/>
  </g>

  <!-- Bangles on wrist (resting hand visible near center) -->
  <g fill="none" stroke="url(#tc-gold)" stroke-width="1.5">
    <ellipse cx="296" cy="252" rx="7" ry="3"/>
    <ellipse cx="296" cy="258" rx="7" ry="3"/>
    <ellipse cx="296" cy="264" rx="7" ry="3"/>
  </g>

  <!-- ========================== -->
  <!-- FLORAL FLOURISH right of C -->
  <!-- ========================== -->
  <g stroke="url(#tc-gold)" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Main stem curving down-right -->
    <path d="M 632 660 Q 700 680 730 720 Q 750 760 745 800"/>
    <!-- Branches -->
    <path d="M 670 685 Q 698 690 720 720"/>
    <path d="M 700 695 Q 740 710 760 750"/>
    <path d="M 720 720 Q 750 740 770 730"/>
    <path d="M 730 760 Q 760 770 780 760"/>
  </g>
  <!-- Flower buds -->
  <g fill="url(#tc-gold-light)" stroke="url(#tc-gold)" stroke-width="0.8">
    <ellipse cx="720" cy="720" rx="5" ry="9" transform="rotate(30 720 720)"/>
    <ellipse cx="760" cy="752" rx="5" ry="9" transform="rotate(45 760 752)"/>
    <ellipse cx="770" cy="730" rx="5" ry="9" transform="rotate(-10 770 730)"/>
    <ellipse cx="780" cy="760" rx="6" ry="10" transform="rotate(20 780 760)"/>
    <ellipse cx="745" cy="800" rx="6" ry="10" transform="rotate(-20 745 800)"/>
  </g>
  <g fill="url(#tc-gold)">
    <circle cx="678" cy="688" r="2"/>
    <circle cx="704" cy="700" r="2"/>
    <circle cx="724" cy="744" r="2"/>
  </g>
  <!-- Tiny leaves -->
  <g fill="url(#tc-gold-light)" opacity="0.85">
    <path d="M 690 702 Q 700 696 710 704 Q 700 710 690 702 Z"/>
    <path d="M 730 740 Q 742 736 750 746 Q 740 752 730 740 Z"/>
  </g>

  <!-- ========================== -->
  <!-- WORDMARK -->
  <!-- ========================== -->
  <g fill="url(#tc-gold)" font-family="'Cormorant Garamond', 'Times New Roman', serif" text-anchor="middle">
    <text x="400" y="850" font-size="76" letter-spacing="22" font-weight="500">TRÉSOR</text>
    <text x="400" y="908" font-size="28" letter-spacing="20" font-weight="400">COUTURE</text>
  </g>

  <!-- Decorative ornaments around COUTURE -->
  <g stroke="url(#tc-gold)" stroke-width="1.4" stroke-linecap="round">
    <line x1="100" y1="898" x2="226" y2="898"/>
    <line x1="574" y1="898" x2="700" y2="898"/>
  </g>
  <g fill="url(#tc-gold)">
    <polygon points="226,898 236,892 236,904"/>
    <polygon points="574,898 564,892 564,904"/>
    <circle cx="100" cy="898" r="2"/>
    <circle cx="700" cy="898" r="2"/>
  </g>
</svg>
